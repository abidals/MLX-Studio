[build-system]
requires = ["setuptools>=77"]   # PEP 639 SPDX license expression (license = "MIT")
build-backend = "setuptools.build_meta"

[project]
name = "alis-studio"
dynamic = ["version"]   # single source of truth: studio.__version__ (see [tool.setuptools.dynamic])
description = "A local, model-agnostic image-generation studio for Apple silicon (MLX)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"   # SPDX expression (PEP 639); replaces the deprecated table form
authors = [{ name = "avlp12" }]
keywords = ["mlx", "apple-silicon", "text-to-image", "image-generation", "diffusion", "studio"]
classifiers = [
    "Environment :: GPU",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
]
# The app itself is pure standard library. Backend deps live in requirements.txt (single source
# of truth): the mflux pin is one commit ahead of the 0.20.0 release — it has to be, until an
# mflux release ships Qwen-Image-2.1 LoRA support (Viggle Turbo backend; see requirements.txt).
# krea2-alis-mlx is installed with `pip install --no-deps` afterwards (its own pins would
# downgrade mflux; see requirements.txt for the one-liner).
dependencies = [
    "mflux @ git+https://github.com/mflux-community/mflux.git@0db686992d65cbd84bd925dfce23b77ad0bedf7d",
    "transformers>=5.0,<6",
    "huggingface-hub>=1.1.6,<2",
    "requests>=2.28,<3",
    "numpy>=1.24,<3",
    "pillow>=10,<13",
]

[project.optional-dependencies]
desktop = ["pywebview>=5,<7"]   # native window (WKWebView on macOS); pulls the pyobjc backend
rewrite = ["mlx-lm>=0.20"]      # optional on-device prompt enhancer/translator (Qwen3-4B via mlx-lm)

[project.scripts]
alis-studio = "studio.server:serve"
alis-studio-desktop = "studio.desktop:main"

[project.urls]
Homepage = "https://github.com/avlp12/alis-studio"
"Krea 2 Turbo backend" = "https://github.com/avlp12/krea2_alis_mlx"

[tool.setuptools]
packages = ["studio", "studio.backends"]

[tool.setuptools.dynamic]
version = { attr = "studio.__version__" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E9"]
